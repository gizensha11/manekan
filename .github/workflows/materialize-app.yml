name: Materialize latest App

on:
  push:
    branches: [pwa-v0.3.6]
    paths:
      - '.materialize/app.part1'
      - '.materialize/app.part2'
      - '.materialize/app.part3'
      - '.materialize/app.part4'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild App.jsx
        shell: bash
        run: |
          cat .materialize/app.part1 .materialize/app.part2 .materialize/app.part3 .materialize/app.part4 > /tmp/app.b64
          base64 -d /tmp/app.b64 | gzip -d > src/App.jsx
      - name: Commit materialized App.jsx
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No App.jsx changes"
            exit 0
          fi
          git commit -m "Update App.jsx to v0.3.6"
          git push
